services:
  vault:
    build:
      context: .
    image: latamware/vault:local
    pull_policy: build
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${PORT:-4321}
      PUBLIC_GOOGLE_CLIENT_ID: ${PUBLIC_GOOGLE_CLIENT_ID}
      VAULT_AUTH_MODE: ${VAULT_AUTH_MODE:-google}
      VAULT_AUTH_ORIGIN: ${VAULT_AUTH_ORIGIN:-}
      GOOGLE_AUTH_CLIENT_ID: ${GOOGLE_AUTH_CLIENT_ID:-}
      GOOGLE_AUTH_CLIENT_SECRET: ${GOOGLE_AUTH_CLIENT_SECRET:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      VAULT_ALLOWED_DOMAINS: ${VAULT_ALLOWED_DOMAINS-latamware.com}
      VAULT_ALLOWED_EMAILS: ${VAULT_ALLOWED_EMAILS:-}
      VAULT_DATABASE_PATH: /app/data/company.sqlite
      VAULT_ADMIN_EMAILS: ${VAULT_ADMIN_EMAILS:-}
      VAULT_ENCRYPTION_KEYS: ${VAULT_ENCRYPTION_KEYS:-}
      VAULT_ACTIVE_KEY_ID: ${VAULT_ACTIVE_KEY_ID:-v1}
    volumes:
      - vault-data:/app/data
    ports:
      - "${PORT:-4321}:${PORT:-4321}"
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(\"http://127.0.0.1:${PORT:-4321}/api/health\").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 5s
      timeout: 20s
      retries: 10
      start_period: 10s

volumes:
  vault-data:
